<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar usuario</title>
    <link rel="stylesheet" href="../CSS/registrousuario.css">
</head>

<body>

    <div class="registro">

        <h1>Crear cuenta</h1>
        <p class="subtitulo">Regístrate en Turtle Inc.</p>

        <form action="#" method="post">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre"
                   placeholder="Ingresa tu nombre" required>

            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" name="apellido"
                   placeholder="Ingresa tu apellido" required>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo"
                   placeholder="correo@ejemplo.com" required>

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono"
                   placeholder="Ingresa tu teléfono" required>

            <label for="fecha">Fecha de nacimiento</label>
            <input type="date" id="fecha" name="fecha" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password"
                   placeholder="Crea una contraseña" required>

            <label for="confirmar">Confirmar contraseña</label>
            <input type="password" id="confirmar" name="confirmar"
                   placeholder="Repite tu contraseña" required>

            <div class="terminos">
                <input type="checkbox" id="terminos" required>
                <label for="terminos">Acepto los términos y condiciones</label>
            </div>

            <button type="submit"><a href="inicio.html">Registrarme</a></button>

        </form>

        <p class="login">
            ¿Ya tienes una cuenta?
            <a href="registro.html">Iniciar sesión</a>
        </p>

    </div>

</body>
</html>
